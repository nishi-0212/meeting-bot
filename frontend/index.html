<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f4ed; --card:#faf9f5; --ink:#141413; --muted:#6b6a64; --line:#e3e0d3;
    --clay:#d97757; --clay-ink:#ffffff; --soft:#f3e3da; --warn:#b42318;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#1f1e1d; --card:#2b2a28; --ink:#faf9f5; --muted:#a7a59b; --line:#3d3b37;
    --clay:#e08a6b; --clay-ink:#1f1e1d; --soft:#3a2d27; --warn:#ff8a80; } }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; line-height:1.6; }
  .page { max-width:760px; margin:0 auto; padding:24px 20px 80px; }
  .top { display:flex; align-items:center; gap:10px; font-family:Newsreader,Georgia,serif; font-size:1.4rem; font-weight:500; }
  .top svg { color:var(--clay); }
  .hero { padding:56px 0 28px; }
  h1 { margin:0; font-family:Newsreader,Georgia,serif; font-weight:400; font-size:clamp(2.4rem,7vw,3.6rem); line-height:1.08; letter-spacing:-.02em; }
  h1 em { color:var(--clay); font-style:italic; }
  .lede { margin:16px 0 0; color:var(--muted); font-size:1.05rem; max-width:52ch; }

  .composer, .doc, .ask { background:var(--card); border:1px solid var(--line); border-radius:20px; }
  .composer { padding:6px; }
  textarea { width:100%; min-height:220px; resize:vertical; border:0; background:transparent; color:var(--ink); font:inherit; padding:16px 18px; }
  textarea:focus { outline:none; }
  .composer:focus-within, .pill:focus-within { border-color:var(--clay); box-shadow:0 0 0 3px var(--soft); }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:8px 10px 10px 18px; }
  button { font:inherit; cursor:pointer; }
  .primary { background:var(--clay); color:var(--clay-ink); border:0; border-radius:12px; padding:10px 18px; font-weight:600; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .link { background:none; border:0; color:var(--muted); padding:0; text-decoration:underline; text-underline-offset:3px; }
  .link:hover { color:var(--ink); }
  :focus-visible { outline:3px solid var(--clay); outline-offset:2px; }

  .doc { margin-top:28px; padding:32px clamp(20px,5vw,40px); }
  .doc-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  h2 { margin:0; font-family:Newsreader,Georgia,serif; font-weight:500; font-size:1.7rem; }
  .summary { font-family:Newsreader,Georgia,serif; font-size:1.25rem; line-height:1.55; margin:14px 0 0; }
  h3 { margin:30px 0 8px; font-family:Newsreader,Georgia,serif; font-weight:500; font-size:1.2rem; }
  ul { margin:0; padding-left:20px; }
  li { margin:6px 0; }
  .item { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line); }
  .av { width:36px; height:36px; border-radius:50%; background:var(--soft); color:var(--clay); display:grid; place-items:center; font-family:Newsreader,Georgia,serif; font-weight:500; font-size:1.1rem; }
  .who { font-size:.85rem; color:var(--muted); }
  .when { font-size:.85rem; padding:3px 10px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; }
  .empty { color:var(--muted); margin:0; }
  .err { color:var(--warn); }

  .ask { margin-top:20px; padding:24px clamp(16px,4vw,32px); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:.9rem; }
  .chip:hover { border-color:var(--clay); }
  #log { display:flex; flex-direction:column; gap:12px; margin:18px 0 6px; }
  .msg { padding:12px 16px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:92%; }
  .user { align-self:flex-end; background:var(--soft); }
  .bot { align-self:flex-start; font-family:Newsreader,Georgia,serif; font-size:1.1rem; line-height:1.55; }
  .pill { display:flex; align-items:center; gap:8px; margin-top:14px; padding:6px 6px 6px 18px; border:1px solid var(--line); border-radius:999px; background:var(--bg); }
  .pill input { flex:1; border:0; background:transparent; color:var(--ink); font:inherit; padding:8px 0; min-width:0; }
  .pill input:focus { outline:none; }
  .send { width:38px; height:38px; border-radius:50%; border:0; background:var(--clay); color:var(--clay-ink); display:grid; place-items:center; }
  .send:disabled { opacity:.5; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>
    Recap
  </header>

  <section class="hero">
    <h1>From meeting to <em>to-do list.</em></h1>
    <p class="lede">Paste a transcript and get the decisions, who owns what, and the deadlines. Then ask questions or draft the follow-up email.</p>
  </section>

  <section class="composer">
    <textarea id="t" placeholder="Paste your meeting transcript here" aria-label="Meeting transcript"></textarea>
    <div class="bar">
      <button class="link" id="sample">Load a sample</button>
      <button class="primary" id="go">Extract action items</button>
    </div>
  </section>

  <article class="doc" id="doc" hidden>
    <div class="doc-head"><h2>Meeting notes</h2><button class="link" id="copy">Copy notes</button></div>
    <div id="notes"></div>
  </article>

  <section class="ask" id="ask" hidden>
    <div class="chips">
      <button class="chip">Draft follow-up email</button>
      <button class="chip">What is still unresolved?</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="pill">
      <input id="q" placeholder="Ask about this meeting" aria-label="Question">
      <button class="send" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </section>
</div>

<script>
const API = "http://127.0.0.1:8000"; // change to your Render URL after deploying
let history = [], notesText = "", busy = false;
const $ = id => document.getElementById(id);

const SAMPLE = `Sneha: Good morning everyone. Let's start with the mobile app release. Where are we?
Arjun: The Android build is stable, but iOS still has the login crash. I think we need two more days.
Sneha: Okay. Then we release Android first on Monday and iOS after the fix. Let's go with that.
Arjun: I'll fix the iOS login crash and share the build with QA by Wednesday.
Kavya: QA can test it Thursday. I'll also prepare the regression checklist before that.
Sneha: Good. Next, the pricing page. Dev, did you hear back from the client?
Dev: Not yet. They said they'd reply sometime this week.
Sneha: Okay, Dev, please follow up with them tomorrow and update the doc.
Kavya: Also, nobody has decided who will write the release notes.
Sneha: Let's leave that open for now. We also need to figure out the budget for the ad campaign, but I don't have the numbers yet.`;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function post(url, body) {
  const r = await fetch(API + url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || "Request failed");
  }
  return r.json();
}

function section(root, title, items) {
  if (!items || !items.length) return;
  root.append(el("h3", title));
  const ul = el("ul");
  items.forEach(i => ul.append(el("li", i)));
  root.append(ul);
}

function render(d) {
  const root = $("notes");
  root.replaceChildren();
  root.append(el("p", d.summary, "summary"));
  section(root, "Decisions", d.decisions);
  if (d.action_items && d.action_items.length) {
    root.append(el("h3", "Action items"));
    d.action_items.forEach(a => {
      const row = el("div", undefined, "item");
      row.append(el("div", (a.owner || "?").trim().charAt(0).toUpperCase(), "av"));
      const mid = el("div");
      mid.append(el("div", a.task));
      mid.append(el("div", a.owner, "who"));
      row.append(mid);
      row.append(el("span", a.deadline, "when"));
      root.append(row);
    });
  }
  section(root, "Open questions", d.open_questions);

  notesText = [d.summary, "", "Decisions:"]
    .concat((d.decisions || []).map(x => "- " + x), ["", "Action items:"],
      (d.action_items || []).map(a => `- ${a.task} (${a.owner}, ${a.deadline})`),
      ["", "Open questions:"], (d.open_questions || []).map(x => "- " + x))
    .join("\n");
  $("doc").hidden = false;
  $("ask").hidden = false;
  $("doc").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("sample").onclick = () => { $("t").value = SAMPLE; };

$("go").onclick = async () => {
  const text = $("t").value.trim();
  const doc = $("doc");
  if (!text) {
    doc.hidden = false;
    $("notes").replaceChildren(el("p", "Paste a transcript first.", "empty err"));
    return;
  }
  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Reading...";
  try {
    render(await post("/extract", { transcript: text }));
    history = [];
    $("log").replaceChildren();
  } catch (e) {
    doc.hidden = false;
    $("notes").replaceChildren(el("p", e.message, "empty err"));
  } finally {
    btn.disabled = false;
    btn.textContent = "Extract action items";
  }
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(notesText); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Copy blocked"; }
  setTimeout(() => ($("copy").textContent = "Copy notes"), 1500);
};

async function ask(q) {
  q = q.trim();
  if (!q || busy) return;
  busy = true;
  $("send").disabled = true;
  const bot = el("div", "Thinking...", "msg bot");
  $("log").append(el("div", q, "msg user"), bot);
  bot.scrollIntoView({ block: "nearest" });
  history.push({ role: "user", content: q });
  $("q").value = "";
  try {
    const { reply } = await post("/chat", { transcript: $("t").value, messages: history });
    history.push({ role: "assistant", content: reply });
    bot.textContent = reply;
  } catch (e) {
    history.pop();
    bot.textContent = e.message;
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

$("send").onclick = () => ask($("q").value);
$("q").onkeydown = e => { if (e.key === "Enter") ask($("q").value); };
document.querySelectorAll(".chip").forEach(c => (c.onclick = () => ask(c.textContent)));
</script>
</body>
</html>
